# Builds the CoreS3 firmware on every push, uploads it as a downloadable artifact,
# and (when the CLOUDFLARE_API_TOKEN secret exists) publishes the "Flash Wisp Box"
# page to Cloudflare Pages project "wispkids-box".
name: Build firmware and flash page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-firmware
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build and merge firmware
        run: firmware/merge.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wisp-box-firmware
          path: flash/firmware/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish flash page to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b1e0a65f1fd3e644795c7b3aed0ce666
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret yet, skipping publish"; exit 0; fi
          npx --yes wrangler@3 pages project create wispkids-box --production-branch main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy flash --project-name wispkids-box --branch main --commit-dirty=true
